name: RapidPlusApp
description: "App quản lý thiết bị RAPID (Forte Rapid+): lịch sử xét nghiệm, đồ thị CT, cài đặt."
publish_to: "none"
version: 1.0.2+3

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  fl_chart: ^0.68.0
  shared_preferences: ^2.2.2
  flutter_libserialport: ^0.4.0 # đọc UART/COM (Log nhiệt)
  file_selector: ^1.0.3 # hộp thoại chọn file (sao lưu / khôi phục)

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
