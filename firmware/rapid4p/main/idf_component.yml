# IDF Component Manager — resolve khi build. Version ghim theo cây vimate-p4 đã chạy
# thật trên board (ESP-IDF 5.5.1); nâng cái nào phải build + soak lại.
# Hai target (2026-09-19): lock file riêng dependencies.lock.<target> (CMakeLists.txt gốc đặt
# DEPENDENCIES_LOCK); `rules: if target` để component P4-only/S3-only không kéo chéo.
dependencies:
  idf:
    version: ">=5.5.0"

  lvgl/lvgl:
    version: "~9.6.0"   # 17/09/2026: build dau tien resolve 9.6.0 - ghim de tai tao duoc
  espressif/esp_lvgl_port:
    # GHIM 2.8.x: 2.9.0 đổi callback DPI theo IDF 5.5.2 (on_frame_buf_complete) → không
    # biên dịch được với 5.5.1. Nâng ^2.9 CHỈ khi đã nâng ESP-IDF >= 5.5.2.
    version: "~2.8.0"

  # ESP32-P4 không có radio: WiFi qua ESP32-C5 trong module, ESP-Hosted SDIO slot 1.
  # esp_hosted 2.12.x: bản 1.4.x không cho SDIO với slave C5.
  espressif/esp_wifi_remote:
    version: "0.14.*"
    rules:
      - if: "target == esp32p4"
  espressif/esp_hosted:
    version: "2.12.*"
    rules:
      - if: "target == esp32p4"

  # Board S3 2.8": panel ILI9341 SPI (vimate s3-28lcd chạy thật với 2.0.2 + esp_lvgl_port 2.8).
  espressif/esp_lcd_ili9341:
    version: "^2.0.0"
    rules:
      - if: "target == esp32s3"
