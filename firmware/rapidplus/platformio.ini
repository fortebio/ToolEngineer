; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32dev]
platform = espressif32 @ ^6.0.1
board = esp32dev
; framework = /Arduino/libraries
framework = arduino

platform_packages =
	#Framework code esp32 
 	framework-arduinoespressif32 @ 3.20011.230801 #2.0.11 
 	#Bootloader code to esp32 
 	tool-esptoolpy @ 1.40501.0 #4.5.1 
 	#Compiler code esp32 
 	toolchain-xtensa-esp32 @ 8.4.0+2021r2-patch5

monitor_speed = 115200
upload_speed = 921600

; AsyncTCP registers its own task with the task watchdog (CONFIG_ASYNC_TCP_USE_WDT
; defaults to 1, AsyncTCP.h:60 -> esp_task_wdt_add). That is wrong for this device:
; postData_GoogleSheet DELIBERATELY starves async_tcp at the end of every run - it calls
; dashboardSuspend() to tear the server down, then blocks DisplayTask inside mbedTLS for
; up to 30 s (handshake) + 60 s (POST; Google Apps Script itself needs ~35-40 s). The
; async task has nothing to do and sits on lwIP for far longer than the 5 s watchdog, so
; it aborts:  "task_wdt: async_tcp (CPU 1)" -> reboot at the end of EVERY upload.
; This does not hide a deadlock - it removes a watchdog on a task we intentionally park.
; Everything else stays watchdogged.
; -Wformat is OFF by default here and a printf mismatch reset the machine in the field
; (docs/history/2026-07-30-printf-loadprohibited-wformat.md). Not -Wall: this targets the class
; that turns an int into a dereferenced pointer, without third-party style noise burying it.
build_flags = -DCONFIG_ASYNC_TCP_USE_WDT=0 -Wformat


lib_deps = 
	olikraus/U8g2@^2.35.4
	adafruit/Adafruit GFX Library@^1.11.7
	arduino-libraries/NTPClient@^3.2.1
	; SPI
	adafruit/Adafruit ILI9341@^1.5.12
	moononournation/GFX Library for Arduino@1.2.1
	milesburton/DallasTemperature@^3.11.0
	paulstoffregen/OneWire@^2.3.8
	adafruit/Adafruit MCP23017 Arduino Library@^2.3.2
	wifwaf/TCA9548A@^1.1.3
	br3ttb/PID@^1.2.1
	bblanchon/ArduinoJson@^7.0.3
	ESP32Async/AsyncTCP @ 3.3.2
	ESP32Async/ESPAsyncWebServer @ 3.6.0
	ricmoo/QRCode @ ^0.0.1

board_upload.flash_size = 8MB
; 8388608 is the FLASH CHIP size, not the app budget: PlatformIO takes the real limit from the
; partition table below (app0 = 0x330000 = 3 342 336 B), which is what "Flash: xx%" reports.
board_upload.maximum_size = 8388608
board_build.partitions = default_8MB.csv
; Only used to BUILD/upload a filesystem image. The firmware never mounts one: the UI lives in
; flash (webAssets.h) and the slot labels in NVS.
board_build.filesystem = littlefs

; pio_gzip_data: gzips data/ and generates src/webAssets.h (the whole UI, as const arrays
;   in flash) on EVERY build - module scope, not a pre-action on the filesystem image, which
;   is no longer built. serveStatic is gone; webDashboard.cpp serves those arrays directly.
;   Generating instead of committing .gz keeps a stale copy from being baked into firmware.bin.
; pio_upload_all: adds the `uploadall` target = upload + uploadfs in one command.
;   NOTE: since the UI moved into the firmware, `uploadfs` writes a filesystem NOTHING mounts.
;   Use plain `upload` - uploadall only costs an extra ~1.5 MB flash erase.
extra_scripts =
	post:tools/pio_upload_all.py
	post:tools/pio_gzip_data.py

; ---------------------------------------------------------------------------
; On-device unit tests for the FreeRTOS mechanism (Unity, runs on real ESP32).
; Inherits everything from [env:esp32dev] (platform, board, packages,
; upload/monitor speed). test_build_src = no => src/ is NOT compiled, so the
; firmware setup()/tasks do not run and no hardware drivers are linked; the
; test program provides its own setup()/loop(). Run with:
;   pio test -e esp32dev_test -v
; The normal firmware build (pio run -e esp32dev) is unaffected.
[env:esp32dev_test]
extends = env:esp32dev
test_framework = unity
test_build_src = no

; ---------------------------------------------------------------------------
; The two shape-rule builds. ONE source tree, one flag, one behavioural difference:
;
;   esp32dev           v2.4.3AT   shape_flag is reported, the call stands   (field trial)
;   esp32dev_shape_neg v2.4.3a    a flagged Positive is called Negative
;
; Both compute and report identical share / rise_width / shape_flag values, so a run from
; one can be compared line-for-line against the same curve scored by the other. The flag is
; read in exactly three places - predict_outcome() (Algo.cpp), FirmwareVer (define.h) and
; the shapeMode field of GET /slots (webDashboard.cpp) - and nowhere else.
;
; build_flags REPLACES the inherited list rather than extending it, so the two flags from
; [env:esp32dev] are repeated here on purpose. Dropping -Wformat would re-open the class of
; bug that reset a machine in the field; dropping the AsyncTCP one brings back a reboot at
; the end of every upload.
[env:esp32dev_shape_neg]
extends = env:esp32dev
build_flags = -DCONFIG_ASYNC_TCP_USE_WDT=0 -Wformat -DSHAPE_RULE_NEGATIVE
