<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>RAPID</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" type="image/png" href="icons8-prawn-48.png">
    <link rel="stylesheet" type="text/css" href="style.css">
    <script src="highcharts.js"></script>
  </head>
  <body>
    <!-- ============ HEADER ============ -->
    <header class="header">
      <div class="header-text">
        <div id="deviceName" class="device-name">RAPIDPlus</div>
        <div id="companyName" class="company-name">Fortebiotech</div>
      </div>
      <span id="status" class="status off">
        <span class="status-dot"></span><span id="statusText">Offline</span>
      </span>
    </header>

    <!-- ============ SCREENS ============ -->
    <main class="screens">

      <!-- ---- HOME ---- -->
      <section id="screen-home" class="screen active">
        <!-- Notification -->
        <div id="notify" class="banner notify hidden">
          <div class="banner-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
          </div>
          <div class="banner-body">
            <div id="notifyTitle" class="banner-title">-</div>
            <div id="notifySub" class="banner-sub">-</div>
          </div>
        </div>

        <!-- Current status (icon swapped by JS: clock or thermometer) -->
        <div class="banner state">
          <div id="stateIcon" class="banner-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><polyline points="12 7 12 12 15.5 14"/></svg>
          </div>
          <div class="banner-body">
            <div id="stateTitle" class="banner-title">Idle</div>
            <div id="stateSub" class="banner-sub">Waiting for a run to start.</div>
          </div>
        </div>

        <!-- Temperatures -->
        <div class="card">
          <p class="card-title">Lysis</p>
          <div class="temp-grid one">
            <div class="temp-box"><div id="tLysis" class="temp-val">-</div><div class="temp-lbl">Temperature</div></div>
          </div>
        </div>

        <div class="card">
          <p class="card-title">Amplification</p>
          <div class="temp-grid four">
            <div class="temp-box"><div id="tAmpLeft" class="temp-val">-</div><div class="temp-lbl">Amp Left</div></div>
            <div class="temp-box"><div id="tAmpRight" class="temp-val">-</div><div class="temp-lbl">Amp Right</div></div>
            <div class="temp-box"><div id="tTopLeft" class="temp-val">-</div><div class="temp-lbl">Top Left</div></div>
            <div class="temp-box"><div id="tTopRight" class="temp-val">-</div><div class="temp-lbl">Top Right</div></div>
          </div>
        </div>

        <!-- Button states -->
        <div class="card">
          <p class="card-title">Buttons</p>
          <div class="btn-row">
            <button type="button" id="bGreen" class="btn-chip green off" data-btn="green">GREEN</button>
            <button type="button" id="bRed" class="btn-chip red off" data-btn="red">RED</button>
            <button type="button" id="bWhite" class="btn-chip white off" data-btn="white">WHITE</button>
          </div>
        </div>
      </section>

      <!-- ---- PROCESS (amplification chart) ---- -->
      <section id="screen-process" class="screen">
        <div class="card">
          <p class="card-title">Realtime LAMP Amplification</p>
          <p class="time">Last update: <span id="lastUpdate">-</span></p>
          <div id="chart" class="chart-container"></div>
        </div>
      </section>

      <!-- ---- SETTING ---- -->
      <section id="screen-setting" class="screen">
        <div class="card">
          <p class="card-title">Device</p>
          <p class="setting-row">ID: <span id="setDevice">-</span></p>
          <p class="setting-row">Company: <span id="setCompany">-</span></p>
          <button type="button" id="reloadBtn" class="reload-btn">Reload</button>
        </div>
      </section>
    </main>

    <!-- ============ BOTTOM NAV ============ -->
    <nav class="bottom-nav">
      <button type="button" class="nav-item active" data-screen="home">
        <span class="nav-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg></span>Home
      </button>
      <button type="button" class="nav-item" data-screen="process">
        <span class="nav-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 12 8 12 11 19 16 5 19 12 21 12"/></svg></span>Process
      </button>
      <button type="button" class="nav-item" data-screen="setting">
        <span class="nav-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></span>Setting
      </button>
    </nav>

    <script src="script.js"></script>
  </body>
</html>
