; FBT-RapidPlus Production — cấu hình PlatformIO
;
; Ba môi trường:
;   esp32dev       firmware production (nạp cho máy thật)
;   native         TEST TRÊN HOST — logic an toàn/config/OTA. Chạy trong CI, không cần phần cứng.
;   esp32dev_test  test trên ESP32 thật — cơ chế FreeRTOS, timing, driver
;
; Xem docs/TESTING.md.

[platformio]
default_envs = esp32dev

; ─── Chung ───────────────────────────────────────────────────────────────────
[env]
build_flags =
	-std=gnu++17
	-I include
	-I src/safety
	-I src/config
	-I src/ota

; ─── Firmware production ─────────────────────────────────────────────────────
[env:esp32dev]
platform = espressif32 @ ^6.0.1
board = esp32dev
framework = arduino

; Toolchain GHIM CHÍNH XÁC, khớp bản đang bán (instrument-wroom32 v2.4.2).
; ĐỪNG nâng tuỳ tiện: đổi toolchain là đổi codegen và layout RAM trên con chip
; không có PSRAM. Nâng thì phải đo lại heap và chạy lại toàn bộ test máy thật.
platform_packages =
	framework-arduinoespressif32 @ 3.20011.230801   ; 2.0.11
	tool-esptoolpy @ 1.40501.0                      ; 4.5.1
	toolchain-xtensa-esp32 @ 8.4.0+2021r2-patch5

; arduino-esp32 2.0.x mặc định gnu++11. Thêm -std=gnu++17 qua build_flags mà
; không gỡ cờ cũ có thể để lại hai cờ -std mâu thuẫn → lỗi biên dịch khó đoán.
build_unflags = -std=gnu++11

monitor_speed = 115200
upload_speed = 921600

board_upload.flash_size = 8MB
board_upload.maximum_size = 8388608
board_build.partitions = partitions/default_8MB.csv
board_build.filesystem = littlefs

; Scaffold cố ý để lib_deps TỐI THIỂU để build nhanh và xanh ngay.
; Khi port code production sang, thêm lại đúng phiên bản đã ghim của
; instrument-wroom32 (U8g2, Adafruit GFX/ILI9341, WiFiManager, NTPClient,
; DallasTemperature, OneWire, MCP23017, TCA9548A, PID, AsyncTCP,
; ESPAsyncWebServer). Thêm TỪNG CÁI và đo heap sau mỗi lần — WROOM-32 không có
; PSRAM, đây là rủi ro NFR-01.
lib_deps =
	bblanchon/ArduinoJson@^7.0.3

; ─── Test trên host ──────────────────────────────────────────────────────────
; Đây là môi trường quan trọng nhất của repo: logic an toàn chạy được trong CI
; trên MỌI commit, không cần cắm máy. Xem AGENTS.md §3.
[env:native]
platform = native
test_framework = unity

; src/ PHẢI được biên dịch vào test (mặc định của `pio test` là không).
test_build_src = yes

; Bỏ main.cpp: nó phụ thuộc Arduino, không biên dịch được trên host.
; Đây chính là lý do logic an toàn không được nằm trong main.cpp.
build_src_filter = +<*> -<main.cpp>

build_flags =
	${env.build_flags}
	-Wall
	-Wextra

; ─── Test trên ESP32 thật ────────────────────────────────────────────────────
; Dành cho thứ KHÔNG mô phỏng được trên host: FreeRTOS, timing, driver.
;   pio test -e esp32dev_test -v
[env:esp32dev_test]
extends = env:esp32dev
test_framework = unity
test_build_src = no
