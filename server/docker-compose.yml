# Stack tự host cho FBT_RAPID: Postgres + API Node/Express, lộ ra ngoài qua
# Cloudflare Tunnel (service `cloudflared`, bật bằng profile `tunnel`).
#
#   docker compose up -d --build                 # chạy db + api (test cục bộ)
#   docker compose --profile tunnel up -d --build # kèm Cloudflare Tunnel
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: fbt
      POSTGRES_USER: fbt
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fbt -d fbt"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://fbt:${POSTGRES_PASSWORD:-changeme}@db:5432/fbt
      ADMIN_TOKEN: ${ADMIN_TOKEN:?set ADMIN_TOKEN trong .env}
      DEVICE_KEY: ${DEVICE_KEY:?set DEVICE_KEY trong .env}
      PORT: "3000"
    depends_on:
      db:
        condition: service_healthy
    # Chỉ mở ra localhost để test bằng curl / app cùng máy. Tunnel KHÔNG cần
    # cổng này (nó vào api:3000 qua mạng nội bộ của compose).
    ports:
      - "127.0.0.1:3000:3000"

  # Cloudflare Tunnel: chỉ chạy khi `--profile tunnel`. Cần TUNNEL_TOKEN trong .env
  # (Zero Trust → Networks → Tunnels → Create → copy token). Trỏ public hostname
  # `api.<domain>` về service http://api:3000 trong dashboard Cloudflare.
  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}
    depends_on:
      - api
    profiles: ["tunnel"]

  # === Public hóa bằng DuckDNS + mở port (profile `duckdns`) ===
  # Chạy: docker compose --profile duckdns up -d --build
  # Cần port-forward 80 + 443 trên router về máy này.

  # Caddy: reverse proxy + HTTPS tự động (Let's Encrypt) cho PUBLIC_HOST → api:3000.
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      # Mặc định localhost (CA nội bộ, khỏi gọi Let's Encrypt) → đổi sang ten.duckdns.org trong .env.
      PUBLIC_HOST: ${PUBLIC_HOST:-localhost}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"   # HTTP/3
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
    profiles: ["duckdns"]

  # DuckDNS: giữ <subdomain>.duckdns.org trỏ đúng IP công khai hiện tại (IP nhà động).
  duckdns:
    image: linuxserver/duckdns:latest
    restart: unless-stopped
    environment:
      SUBDOMAINS: ${DUCKDNS_SUBDOMAIN:-}
      TOKEN: ${DUCKDNS_TOKEN:-}
      TZ: Asia/Ho_Chi_Minh
    profiles: ["duckdns"]

volumes:
  pgdata:
  caddy_data:
  caddy_config:
